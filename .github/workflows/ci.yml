name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      MONGO_TEST_URI: mongodb://127.0.0.1:27017
      MONGO_URI: mongodb://127.0.0.1:27017
      MONGO_DB: vibesync_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.12
        run: uv venv --python 3.12 .venv

      - name: Install project (dev extras)
        run: uv pip install -p .venv/bin/python -e ".[dev]"

      - name: Ruff check
        run: uvx ruff check app tests scripts

      - name: Run tests
        run: .venv/bin/pytest -q

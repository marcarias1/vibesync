# Ver https://pre-commit.com para más info.
# Instalar:  pre-commit install
# Ejecutar:  pre-commit run --all-files
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.19
    hooks:
      # Linter (con auto-fix).
      - id: ruff
        args: ["--fix"]
      # Formateador.
      - id: ruff-format
